name: Continuous Integration

on:
  push:
    branches: [ main, master, 'jules-**' ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-quality-and-tests:
    name: Backend Lint, Typecheck & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          enable-cache: true

      - name: Install backend dependencies
        run: |
          cd backend
          uv sync

      - name: Run Backend Pytest with Coverage
        run: |
          cd backend
          uv run pytest --cov=app --cov-report=term-missing

  frontend-quality-and-build:
    name: Frontend Lint, Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Run ESLint
        run: |
          cd frontend
          npm run lint

      - name: Run TypeScript Check
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Run Production Build
        run: |
          cd frontend
          npm run build
